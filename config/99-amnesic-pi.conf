# net.ipv4.ip_forward is deliberately NOT set here. systemd-sysctl.service
# applies this file unconditionally at boot regardless of whether the
# firewall loaded; forwarding is instead enabled only by amnesic-pi
# apply-firewall itself, after its nftables transaction succeeds. See
# src/amnesic_pi/firewall.py:enable_ipv4_forwarding.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Stage 1 deliberately has no IPv6 authority path.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
