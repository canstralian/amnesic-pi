# Baseline kernel network posture for Amnesic Pi.
#
# Forwarding is deliberately ZERO here and is never granted by this file.
# `amnesic-pi-firewall apply` is the only thing that turns forwarding on, and
# it does so only after the nftables policy has been installed AND
# independently verified. A boot-time grant in this file would reintroduce the
# exact failure it used to cause: firewall fails -> systemd-sysctl enables
# forwarding anyway -> clearnet forwarding remains possible.
# The 99- prefix matters: sysctl.d files apply in lexicographic order, so this
# file lands after anything a distribution or package drops in earlier. If some
# other file enables forwarding, this one turns it back off -- and the firewall
# transaction forces it to 0 again before installing policy regardless.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0

net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Stage 1 deliberately has no IPv6 authority path.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
