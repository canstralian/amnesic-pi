# Drop-in for tor@default.service.
#
# BindsTo gives the lifetime relationship Requires= does not: if the firewall
# unit becomes inactive, Tor is stopped rather than left running without the
# policy that constrains it.
[Unit]
BindsTo=amnesic-pi-firewall.service
After=amnesic-pi-firewall.service

[Service]
# Fetch this boot's consensus rather than trusting the image's cached one. Under
# OverlayFS the cache and the boot clock are frozen together and would agree
# while both being stale, defeating amnesic-pi-clock.service. No leading "-": a
# cache that cannot be removed fails Tor's start rather than being trusted.
ExecStartPre=/usr/local/bin/amnesic-pi-anon forget-consensus
