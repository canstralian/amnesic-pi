# Drop-in for systemd-networkd.service.
#
# This is the authority gate, not network-pre.target. network-pre.target is a
# passive synchronisation point: a unit ordered Before= it can fail while the
# target is still reached. Binding the network manager directly to the firewall
# unit is what makes "no firewall" mean "no network manager".
[Unit]
BindsTo=amnesic-pi-firewall.service
After=amnesic-pi-firewall.service
