[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesic-pi"
version = "0.1.0"
description = "Fail-closed ARM64 Tor appliance controls for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amnesic Pi contributors"}]
dependencies = []

[project.scripts]
amnesic-pi = "amnesic_pi.cli:main"
amnesic-pi-anon = "amnesic_pi.anon:main"
amnesic-pi-firewall = "amnesic_pi.fw:main"
amnesic-orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "netns: packet-level fail-closed tests needing root and network namespaces",
]

[tool.ruff]
target-version = "py311"
line-length = 100

# Pinned explicitly rather than inherited. CI installs ruff unpinned, so relying
# on its default rule set means a ruff release can turn the build red without a
# commit — which is exactly what happened when isort (I) entered the defaults.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
