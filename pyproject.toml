[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesic-pi"
version = "0.1.0"
description = "Fail-closed ARM64 Tor appliance controls for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amnesic Pi contributors"}]
dependencies = []

[project.scripts]
amnesic-pi = "amnesic_pi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

# Pinned explicitly rather than inherited. CI installs ruff unpinned, so relying
# on its default rule set lets a ruff release turn the build red with no commit
# behind it — which is what happened when isort (I) entered the defaults. This
# records what CI enforces today; changing what is linted is now a deliberate
# edit to this list.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
