# This job is verification-only: no lockfile writes or automatic dependency updates.
name: Actions Lockfile Verification

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Verify locked GitHub Actions dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Install pinned GitHub Actions lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify lockfile coverage and upstream provenance
        run: gh actions-lock --verify
