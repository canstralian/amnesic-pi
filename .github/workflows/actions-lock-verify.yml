# Bootstrap is intentionally read-only. Generated files are emitted for review,
# never pushed by a GitHub Actions token.
name: Actions Lockfile Verification

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Verify locked GitHub Actions dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install GitHub's pinned lockfile extension
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify lockfile or report first-onboarding output
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/workflows/actions.lock ]]; then
            gh actions-lock --verify
          else
            echo "::notice::No lockfile exists; generating a review-only bootstrap bundle"
            gh actions-lock
            echo "BEGIN_ACTIONS_LOCK_BOOTSTRAP_BUNDLE"
            tar -czf - .github/workflows | base64 -w0
            echo
            echo "END_ACTIONS_LOCK_BOOTSTRAP_BUNDLE"
          fi
